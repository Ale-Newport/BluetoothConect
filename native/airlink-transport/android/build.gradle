buildscript {
  repositories { google(); mavenCentral() }
  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def resolve(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.airlink.transport"

  // minSdk 26 is the floor for BluetoothLeAdvertiser.startAdvertisingSet and
  // Wi-Fi Aware; 29 would be needed for L2CAP, which is why L2CAP is behind a
  // runtime capability check rather than a compile-time one.
  compileSdk resolve("compileSdkVersion", 36)

  defaultConfig {
    minSdk resolve("minSdkVersion", 26)
    targetSdk resolve("targetSdkVersion", 36)
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlin { jvmToolchain(17) }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories { google(); mavenCentral() }

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
